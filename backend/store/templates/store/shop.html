{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Thumb | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'store/css/nav.css' %}">
    <link rel="stylesheet" href="{% static 'store/css/shop.css' %}">
</head>

<body data-page="shop" data-static-root="{% get_static_prefix %}">

    {% include 'store/partials/navbar.html' with show_search=True %}

    <main class="shop-wrap">
        <h1 class="shop-title">Shop</h1>

        <section class="products-grid" id="products-grid">
            <article class="product-card">
                <img src="{% static 'images/products/waterbottle.png' %}" alt="">
                <div class="product-info">
                    <h2 class="product-name"></h2>
                    <p class="product-desc"></p>
                    <div class="product-price"></div>
                    <div class="cart-controls">
                        <div class="qty-group">
                            <button onclick="changeQty(this,-1)">-</button>
                            <span class="qty">1</span>
                            <button onclick="changeQty(this,1)">+</button>
                        </div>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                </div>
            </article>
        </section>

        <p class="search-empty" id="search-empty" hidden>No products match your search.</p>
    </main>

    <script>
        var django_shop_items = JSON.parse('{{ shop_data|default:"[]"|escapejs }}');
    </script>
    <script src="{% static 'store/js/common.js' %}"></script>
    <script src="{% static 'store/js/shop.js' %}"></script>
</body>
</html>
